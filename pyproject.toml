[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoyu-desk"
version = "0.1.0"
description = "Xiaoyu Desk — a KiroCrew distribution driven by the xiaoyu agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Pinned exactly, not ranged: the adapter reaches past xiaoyu's CLI into its
# library surface (AcpServer, Toolbox, McpManager), which a release is free to
# reshape. Upgrading is a deliberate edit plus a test run.
#
# 0.33.0 is the floor for a working adapter, not just a preference: it is the
# first release where `Toolbox(mcp_view=...)` is honored for a FULL toolbox.
# Before it, the injection was accepted and silently dropped — the session came
# up healthy with none of the agent spec's MCP servers and the operator's own
# mcp.json in their place. `factory.py` asserts that behavior at session build
# rather than trusting this pin, because the fix once existed unreleased under an
# already-published version number, and no version specifier could tell the two
# apart. That assertion stays as a sentinel against any future drift.
dependencies = [
    "xiaoyu-agent==0.33.0",
]

[project.scripts]
# What KIROCREW_KIRO_BIN points at.
xiaoyu-desk-acp = "xiaoyu_desk.acp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
