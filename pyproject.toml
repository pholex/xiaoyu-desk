[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoyu-desk"
dynamic = ["version"]
description = "羽案 — a KiroCrew distribution driven by the xiaoyu agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Fenghuang", email = "pholex@gmail.com" }]
keywords = ["kirocrew", "acp", "agent-client-protocol", "xiaoyu", "llm", "coding-agent"]
classifiers = [
    # Beta on purpose: the adapter is used daily but several KiroCrew features
    # do not work through it yet, and one of them fails silently (see README).
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
# Pinned exactly, not ranged: the adapter reaches past xiaoyu's CLI into its
# library surface (AcpServer, Toolbox, McpManager), which a release is free to
# reshape. Upgrading is a deliberate edit plus a test run.
#
# 0.33.0 is the floor for a working adapter, not just a preference: it is the
# first release where `Toolbox(mcp_view=...)` is honored for a FULL toolbox.
# Before it, the injection was accepted and silently dropped — the session came
# up healthy with none of the agent spec's MCP servers and the operator's own
# mcp.json in their place. `factory.py` asserts that behavior at session build
# rather than trusting this pin, because the fix once existed unreleased under an
# already-published version number, and no version specifier could tell the two
# apart. That assertion stays as a sentinel against any future drift.
dependencies = [
    "xiaoyu-agent==0.33.0",
]

[project.urls]
Homepage = "https://github.com/pholex/xiaoyu-desk"
Repository = "https://github.com/pholex/xiaoyu-desk"
Issues = "https://github.com/pholex/xiaoyu-desk/issues"

[project.scripts]
# What KIROCREW_KIRO_BIN points at.
xiaoyu-desk-acp = "xiaoyu_desk.acp.cli:main"

[tool.setuptools.dynamic]
version = { attr = "xiaoyu_desk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
